########################################
# Backend
backend = "glx";

########################################
# VSync
vsync = true;

########################################
# Blur settings
blur-method = "gaussian";
blur-strength = 7;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-kern = "7x7box";

########################################
# Transparency rules
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
alpha-step = 0.06;

opacity-rule = [
  "90:class_g = 'Ghostty'",
  "95:class_g = 'kitty'"
];

########################################
# Shadow settings (optional)
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.4;
shadow-exclude = [
  "class_g = 'Conky'",
  "class_g = 'notify-osd'",
  "class_g = 'Cairo-clock'",
  "name = 'Notification'",
  "name *= 'slop'",
  "class_g ?= 'i3-frame'"
];

########################################
# Rounded corners (optional)
corner-radius = 10;
round-borders = 1;
round-borders-exclude = [
  "class_g = 'i3-frame'"
];

########################################
# Performance tweaks
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
unredir-if-possible = false;

########################################
# Logging
log-level = "warn";